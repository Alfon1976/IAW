# Sitio de Radio Marea · https://radio.iaw.local  (en tu navegador: https://localhost:8452)
# Después de cambiarlo: ./practica.sh recargar  (hace nginx -t antes de recargar: si hay un error, te dice la línea)

# 👀 Por HTTP, nada: todo se manda a HTTPS (la UD3).
server {
    listen 80 default_server;
    server_name radio.iaw.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name radio.iaw.local;

    ssl_certificate     /etc/ssl/lab/lab.crt;       # 👀 certificado de prueba para *.iaw.local
    ssl_certificate_key /etc/ssl/lab/lab.key;

    root /var/www/radio;                            # la carpeta web/ del kit
    
    # ✍️ A1.2 · La portada es index.php: buscamos index.php antes que index.html
    index index.php index.html;


    location ~ \.php$ { try_files $uri =404; 
    fastcgi_pass php:9000; 
    fastcgi_index index.php; 
    fastcgi_param SCRIPT_FILENAME /var/www/radio$fastcgi_script_name; 
    include fastcgi_params; } 


    access_log /var/log/nginx/radio_access.log;
    error_log  /var/log/nginx/radio_error.log;

    # 👀 Los ficheros que existen (estilo.css, el logo…) los sirve Nginx; si no existen, 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # ✍️ A4.1 y A4.2 · Lo que no debe verse desde fuera con un 403:
    # Usamos "^~" para bloquearlos de inmediato antes de que pasen a la evaluación de expresiones PHP
    location ^~ /diagnostico.php {
        deny all;
    }

    location ^~ /inc/ {
        deny all;
    }

    # ✍️ A1.1 y A1.3 · Los .php, a PHP-FPM (contenedor «php», puerto 9000).
    # try_files intercepta si el archivo físico no existe y lanza el 404 de Nginx directamente
    location ~ \.php$ {
        try_files $uri =404;
        
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # ✍️ B1 · Todo lo que empieza por /api/, a la API (contenedor «app», Gunicorn, puerto 8000)
    location /api/ {
        proxy_pass http://app:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

